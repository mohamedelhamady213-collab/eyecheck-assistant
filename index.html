<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EyeCheck Assistant</title>
<style>body{font-family:system-ui;max-width:680px;margin:2rem auto;padding:0 1rem}textarea{width:100%;height:120px}
.warn{background:#fff4e5;border:1px solid #f5a623;padding:.7rem;border-radius:6px}.urgent{background:#fde8e8;border:1px solid #d33;padding:.7rem;border-radius:6px}
pre{white-space:pre-wrap;background:#f5f5f5;padding:.7rem;border-radius:6px}</style></head>
<body>
<h1>EyeCheck Assistant</h1>
<p class="warn"><b>Informational only, not a medical diagnosis.</b> Always see an eye doctor for any concern.</p>
<div id="urgent" class="urgent" hidden><b>Possible urgent symptoms.</b> Sudden vision loss, severe pain, flashes, a curtain over vision, chemical contact or injury need emergency care now.</div>
<label for="symptoms">Describe your eye symptoms</label>
<textarea id="symptoms" placeholder="e.g. Right eye is red and itchy for 3 days, no pain"></textarea>
<p><button id="analyze">Analyze privately (on-device)</button></p>
<h3>Private summary (made on your device)</h3><pre id="summary"></pre>
<label><input type="checkbox" id="consent"> Send only this summary (not my original text) to cloud Gemini for a general explanation</label>
<p><button id="explain" hidden>Get general explanation</button></p>
<pre id="answer"></pre>
<script type="module" src="/src/main.js"></script>
</body></html>
