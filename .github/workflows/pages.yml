name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx vite build --base=/eyecheck-assistant/
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCPdik9Knp4ISLgcYcwBEwuaitp8FILzxM
          VITE_FIREBASE_AUTH_DOMAIN: eyecheck-assistant.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: eyecheck-assistant
          VITE_FIREBASE_APP_ID: 1:588274181888:web:1b27dedcd205c607aaf5e5
          VITE_RECAPTCHA_SITE_KEY: 6Le0_zEuAAAAAM0Yv9wSI7jx7ivRzNKeMUSHDsS_
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
